{% extends "base.html" %}
{% set editing = contact is not none %}
{% block title %}{{ "Edit" if editing else "Add" }} contact · Contact Manager{% endblock %}
{% block content %}
<section class="form-panel">
  <p class="eyebrow">CONTACT DETAILS</p>
  <h1>{{ "Edit contact" if editing else "Add a contact" }}</h1>
  <form method="post" class="contact-form">
    <label for="name">Full name *</label>
    <input id="name" name="name" required maxlength="120" value="{{ contact['name'] if editing else '' }}">
    <label for="phone">Phone number</label>
    <input id="phone" name="phone" maxlength="40" value="{{ contact['phone'] if editing else '' }}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" maxlength="254" value="{{ contact['email'] if editing else '' }}">
    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3" maxlength="500">{{ contact['address'] if editing else '' }}</textarea>
    <div class="actions">
      <button type="submit">{{ "Save changes" if editing else "Save contact" }}</button>
      <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
